# release-plz owns versioning, changelogs, tags, and crates.io publishing.
#
# A workspace publish must happen in dependency order — piramid-compute before piramid-core
# before piramid-storage, and so on — which is exactly the thing release-plz does natively and
# a hand-written workflow gets wrong.

[workspace]
# One version across every crate. They are released together and only ever used together;
# independent versions would be bookkeeping with no benefit.
dependencies_update = false
git_release_enable = true
git_tag_enable = true
publish_features = []

# Conventional-commit sections for the generated changelog.
[changelog]
sort_commits = "oldest"

[[package]]
name = "piramid"
# The umbrella crate carries the README users see on crates.io.
readme_update = false
