[workspace]
resolver = "2"
# Everything first-party lives under `apps/`: the engine (the library tree, grouped by subsystem),
# the binary that fuses it together, the site, and the client SDKs.
members = [
    "apps/engine/core",
    "apps/engine/hardware/compute",
    "apps/engine/hardware/gpu",
    "apps/engine/data/storage",
    "apps/engine/data/collections",
    "apps/engine/retrieval/index",
    "apps/engine/retrieval/search",
    "apps/engine/retrieval/embeddings",
    "apps/engine/inference",
    "apps/engine/service/observability",
    "apps/engine/service/server",
    "apps/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ashworks1706/piramid"
homepage = "https://piramiddb.com"
documentation = "https://docs.rs/piramid"
rust-version = "1.87"  # `usize::is_multiple_of` / `next_multiple_of`, used by compute::kernels

[workspace.dependencies]
# in-repo crates — every internal dependency goes through here so versions stay in lockstep
piramid-core = { path = "apps/engine/core", version = "0.2.0" }
piramid-compute = { path = "apps/engine/hardware/compute", version = "0.2.0" }
piramid-gpu = { path = "apps/engine/hardware/gpu", version = "0.2.0" }
piramid-storage = { path = "apps/engine/data/storage", version = "0.2.0" }
piramid-index = { path = "apps/engine/retrieval/index", version = "0.2.0" }
piramid-search = { path = "apps/engine/retrieval/search", version = "0.2.0" }
piramid-collections = { path = "apps/engine/data/collections", version = "0.2.0" }
piramid-embeddings = { path = "apps/engine/retrieval/embeddings", version = "0.2.0" }
piramid-inference = { path = "apps/engine/inference", version = "0.2.0" }
piramid-observability = { path = "apps/engine/service/observability", version = "0.2.0" }
piramid-server = { path = "apps/engine/service/server", version = "0.2.0" }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

# errors
thiserror = "1.0"

# async + http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "set-header", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "trace"] }
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.34"

# cli
clap = { version = "4.5", features = ["derive"] }

# compute
wide = "0.7"
rayon = "1.10"
num_cpus = "1.16"
rand = "0.8"

# storage + concurrency
memmap2 = "0.9"
lru = "0.16.3"
dashmap = "6.0"
parking_lot = "0.12"
libc = "0.2"

# dev
criterion = { version = "0.5", features = ["html_reports"] }
log = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# Ratchet: flip to "warn" per crate as public items are documented. The new crates
# (compute, gpu, inference) already enforce it via `#![deny(missing_docs)]`.
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Ratchet: currently ~20 call sites outside tests. Fix at the source, then flip to "deny".
unwrap_used = "allow"
expect_used = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
