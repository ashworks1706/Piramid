[package]
name = "piramid-gpu"
description = "Device runtime: contexts, buffers, streams, compiled kernels."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true

[dev-dependencies]

[features]
default = []
gpu-cuda = []

# Cargo does not allow per-crate overrides on top of `lints.workspace = true`, so this crate
# restates the workspace set with one change: `unsafe_code` is allowed. Device memory is
# inherently unsafe, and this is the one crate where it is expected and reviewed. Every block
# carries a `// SAFETY:` justification.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "allow"
expect_used = "allow"
