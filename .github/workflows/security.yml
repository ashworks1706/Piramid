name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories surface without waiting for a PR.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  # The scheduled run has no diff to compare against, so it audits everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '**/Cargo.toml'
              - 'apps/website/package-lock.json'
              - '.github/workflows/security.yml'
            rust:
              - '**/*.rs'
              - '.github/workflows/security.yml'

  deny:
    name: cargo-deny
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # unsafe_code is denied workspace-wide with two audited exceptions. See SECURITY.md.
  unsafe-audit:
    name: Unsafe audit
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check allow(unsafe_code) sites against the known list
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              apps/engine/gpu/*|apps/engine/storage/src/persistence/mmap.rs|apps/engine/server/src/disk.rs)
                echo "  ok   $f" ;;
              *)
                echo "  FAIL $f — unreviewed unsafe_code allowance"
                status=1 ;;
            esac
          done < <(grep -rl 'allow(unsafe_code)' apps --include='*.rs' | sort)
          if [ $status -ne 0 ]; then
            echo
            echo "If this allowance is intended, document it in SECURITY.md and add it here."
            exit 1
          fi
          echo "unsafe audit ok — expected sites only"

  dependency-review:
    name: Dependency review
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
